<!doctype html>
<html><head><meta charset="utf-8"><meta name="size" content="452x300"><link rel="stylesheet" href="holo.css">
<style>
.scene { position: absolute; width: 214px; height: 128px; border: 1px solid var(--line); }
.scene canvas { width: 214px; height: 128px; display: block; }
.lab { position: absolute; font-size: 9px; color: var(--gold); }
.sub { position: absolute; font-size: 6.6px; color: var(--muted); }
</style></head>
<body style="background:#05070a">
<!-- The four markers over a plot for sale (client/PlotMarkers.java), each in the plot's own colour. -->
<div class="scene" style="left:8px;top:8px"><canvas id="a"></canvas></div>
<div class="scene" style="left:230px;top:8px"><canvas id="b"></canvas></div>
<div class="scene" style="left:8px;top:156px"><canvas id="c"></canvas></div>
<div class="scene" style="left:230px;top:156px"><canvas id="d"></canvas></div>
<div class="lab" style="left:10px;top:139px">ARROW</div><div class="sub" style="left:44px;top:141px">20% see-through, the name above</div>
<div class="lab" style="left:232px;top:139px">SPHERE</div><div class="sub" style="left:270px;top:141px">the name circles it</div>
<div class="lab" style="left:10px;top:287px">BEACON</div><div class="sub" style="left:48px;top:289px">a pulsing beam from the ground</div>
<div class="lab" style="left:232px;top:287px">SIGN</div><div class="sub" style="left:258px;top:289px">FOR SALE, the name and the price</div>
<script src="plot_scene.js"></script>
<script>
document.fonts.ready.then(() => {
  drawPlot(document.getElementById('a'), {marker: 'arrow', colour: '#ffd23a', size: 1, text: 1, height: 2, name: 'Market Stall 3', price: '3 gold coins'});
  drawPlot(document.getElementById('b'), {marker: 'sphere', colour: '#b58cff', size: 2, text: 1.2, height: 1, name: 'Harbour View', price: ''});
  drawPlot(document.getElementById('c'), {marker: 'beacon', colour: '#19d3b0', size: 1, text: 1, height: 3, name: 'East Farm', price: ''});
  drawPlot(document.getElementById('d'), {marker: 'sign', colour: '#ff9f40', size: 1.6, text: 1, height: 1, name: 'Bakery Corner', price: '12,000 pieces'});
});
</script>
</body></html>
