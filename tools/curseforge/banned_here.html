<!doctype html>
<html><head><meta charset="utf-8"><meta name="size" content="452x268"><link rel="stylesheet" href="holo.css">
<style>
/* Laid out from client/BannedHereScreen.java (420 x 236): cells 17 from (12, 42), 23 columns, 9 rows, the card under the grid. */
.slot { position: absolute; width: 16px; height: 16px; background: #171b22; outline: 1px solid; }
.slot svg { position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; }
.slot.pick { outline-color: #fff !important; }
</style></head>
<body>
<div class="world"></div>
<div class="screen" style="left:16px;top:16px;width:420px;height:236px" id="s">
    <div class="abs t1 tq" style="left:8px;top:8px">BANNED HERE</div>
    <div class="abs t6 muted" style="left:80px;top:10px">Sanctuary Plot 3: 1,473 items</div>
    <div class="chip" style="left:368px;top:6px;width:44px;height:12px;font-size:8px;color:var(--text)">CLOSE</div>
    <div class="inset" style="left:8px;top:22px;width:120px;height:14px"><span class="abs t6 hint" style="left:4px;top:4px">search, or @mod</span></div>
    <div class="chip on" style="left:134px;top:23px;width:34px;height:12px;font-size:5.8px;color:var(--text);border-color:var(--text);background:rgba(230,234,242,.1)">ALL 1,473</div>
    <div class="chip" style="left:170px;top:23px;width:46px;height:12px;font-size:5.8px">PLACE 1,473</div>
    <div class="chip" style="left:218px;top:23px;width:38px;height:12px;font-size:5.8px">USE 1,473</div>
    <div class="chip" style="left:258px;top:23px;width:34px;height:12px;font-size:5.8px;color:var(--hint)">BREAK 0</div>
    <div class="chip" style="left:294px;top:23px;width:42px;height:12px;font-size:5.8px;color:var(--hint)">BRING IN 0</div>
    <div class="inset" style="left:8px;top:38px;width:404px;height:161px"></div>
    <div class="abs" style="left:406px;top:42px;width:4px;height:153px;background:#171b22"></div>
    <div class="abs" style="left:406px;top:42px;width:4px;height:34px;background:var(--dim)"></div>
    <!-- the card for the item under the mouse -->
    <div class="abs" style="left:8px;top:203px;width:404px;height:25px;background:#0a0d12;border:1px solid var(--line)"></div>
    <div class="abs" id="cardicon" style="left:11px;top:207px;width:16px;height:16px"></div>
    <div class="abs t75 text" style="left:30px;top:207px">Digital Miner</div>
    <div class="abs t5 hint" style="left:30px;top:216px">Mekanism&nbsp;&nbsp;mekanism:digital_miner</div>
    <div class="chip gold" style="left:224px;top:209px;width:44px;height:11px;font-size:5.4px">PLACE</div>
    <div class="chip on" style="left:270px;top:209px;width:44px;height:11px;font-size:5.4px">USE</div>
    <div class="chip" style="left:316px;top:209px;width:44px;height:11px;font-size:5.4px">BREAK</div>
    <div class="chip" style="left:362px;top:209px;width:44px;height:11px;font-size:5.4px">BRING IN</div>
</div>
<script>
const s = document.getElementById('s');
const add = h => s.insertAdjacentHTML('beforeend', h);
function cube(t, l, r, dot) {
  let v = `<svg viewBox="0 0 12 12"><polygon points="6,0.5 11.5,3.2 6,6 0.5,3.2" fill="${t}"/><polygon points="0.5,3.2 6,6 6,11.5 0.5,8.8" fill="${l}"/><polygon points="11.5,3.2 6,6 6,11.5 11.5,8.8" fill="${r}"/>`;
  if (dot) v += `<rect x="5" y="2.2" width="2" height="1.2" fill="${dot}"/><rect x="2.3" y="6" width="1.6" height="1.6" fill="${dot}"/><rect x="8" y="6.6" width="1.6" height="1.6" fill="${dot}"/>`;
  return v + '</svg>';
}
function rod(c, h) { return `<svg viewBox="0 0 12 12"><rect x="1" y="5" width="10" height="2" fill="${c}"/><rect x="1" y="4.4" width="10" height=".6" fill="${h}"/></svg>`; }
function orb(c, h) { return `<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.4" fill="${c}"/><circle cx="4.6" cy="4.4" r="1.4" fill="${h}"/></svg>`; }
function tool(c, h) { return `<svg viewBox="0 0 12 12"><rect x="5.2" y="4" width="1.6" height="7.5" fill="#8a6a30"/><rect x="2" y="1" width="8" height="3.2" fill="${c}"/><rect x="2" y="1" width="8" height="1" fill="${h}"/></svg>`; }
const hue = (h, s, l) => `hsl(${h} ${s}% ${l}%)`;
function block(h, s, l, dot) { return cube(hue(h, s, l + 12), hue(h, s, l), hue(h, s, l - 8), dot); }
// mods and a few of their items, in Region Guard's order (by mod, then by name)
const mods = [
  ['APPLIED ENERGISTICS 2', 30, [[i => block(260, 18, 34 + (i % 3) * 4, i % 2 ? '#b58cff' : null)], [i => rod(hue(275, 40, 45 + (i % 4) * 5), '#d9c8ff')]]],
  ['BALLISTIX', 13, [[i => rod(hue(10, 10, 55), '#e8e8e8')], [i => orb('#3a3f48', '#ff6b5c')]]],
  ['CREATE', 23, [[i => block(32, 45, 40 + (i % 3) * 3, '#c9a35a')], [i => tool('#c9a35a', '#e8d29a')]]],
  ['MEKANISM', 32, [[i => block(205, 12, 44 + (i % 4) * 3, ['#5de6e0', '#ffd23a', '#ff6b5c', '#2ecc71'][i % 4])], [i => tool('#a9b2bf', '#e6eaf2')]]],
  ['MINECRAFT', 8, [[i => cube('#e8e8e8', '#d23a2e', '#b02c22')], [i => orb('#d9a6ff', '#ffffff')], [i => block(280, 40, 18, '#ff8a2a')]]],
];
let row = 0, slots = [];
for (const [name, n, kinds] of mods) {
  if (row >= 9) break;
  const y = 42 + row * 17;
  add(`<div class="abs t6 muted" style="left:12px;top:${y + 5}px">${name}</div>`);
  add(`<div class="abs" style="left:12px;top:${y + 13}px;width:389px;height:1px;background:var(--line)"></div>`);
  row++;
  for (let i = 0; i < n && row < 9; i++) {
    const c = i % 23;
    if (c === 0 && i > 0) row++;
    if (row >= 9) break;
    const k = kinds[(i * 7 + 3) % kinds.length];
    slots.push([12 + c * 17, 42 + row * 17, k[0](i), name, i]);
  }
  row++;
}
const colourOf = () => 'var(--gold)'; // PLACE is the strongest rule on every item of this list
const isPick = (mod, i) => mod === 'MEKANISM' && i === 5;
slots.forEach(([x, y, svg, mod, i]) => add(`<div class="slot${isPick(mod, i) ? ' pick' : ''}" style="left:${x}px;top:${y}px;outline-color:${colourOf()}">${svg}</div>`));
const picked = slots.find(sl => isPick(sl[3], sl[4]));
document.getElementById('cardicon').innerHTML = `<div class="slot" style="left:0;top:0;outline:none;background:none">${picked ? picked[2] : ''}</div>`;
// the pointer over the picked slot
if (picked) add(`<svg class="abs" style="left:${picked[0] + 9}px;top:${picked[1] + 9}px;width:9px;height:12px" viewBox="0 0 9 12"><polygon points="0,0 0,10 3,7.5 5,11.5 6.6,10.8 4.7,7 8.5,7" fill="#fff" stroke="#000" stroke-width=".7"/></svg>`);
</script>
</body></html>
